<svg width="600" height="580" viewBox="0 0 600 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gTxt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="gLineTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <linearGradient id="gLineLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <linearGradient id="gLineRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B61FF"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
  </defs>

  <rect width="600" height="580" fill="#07071A"/>

  <!-- Connector lines — gradient, visible but not dominant -->
  <line x1="195" y1="195" x2="405" y2="195" stroke="url(#gLineTop)" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="195" y1="195" x2="300" y2="375" stroke="url(#gLineLeft)" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="405" y1="195" x2="300" y2="375" stroke="url(#gLineRight)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- D — purple -->
  <circle cx="195" cy="195" r="76" fill="#A855F7"/>
  <text x="195" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="86" font-weight="900" fill="#FFFFFF">D</text>

  <!-- U — violet -->
  <circle cx="405" cy="195" r="76" fill="#7B61FF"/>
  <text x="405" y="221" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="86" font-weight="900" fill="#FFFFFF">U</text>

  <!-- M — site green, full strength -->
  <circle cx="300" cy="375" r="76" fill="#00FFA3"/>
  <text x="300" y="401" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="86" font-weight="900" fill="#07071A">M</text>

  <!-- DUM CLUB -->
  <text x="300" y="490" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="48" font-weight="900" letter-spacing="6" fill="url(#gTxt)">DUM CLUB</text>

  <!-- DIGITAL UTILITY MARKET -->
  <text x="300" y="532" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="13" font-weight="400" letter-spacing="7" fill="#64748B">DIGITAL UTILITY MARKET</text>
</svg>